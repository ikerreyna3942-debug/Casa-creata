<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASA CREATA · Showroom 3D Interactivo</title>
<style>
  :root{
    --bg:#dad6cf;
    --bar-bg:rgba(30,30,34,.96);
    --btn-pill:#353539;
    --btn-pill-active:#ebd8c3;
    --btn-pill-active-text:#1c1a18;
    --fg:#f5f3ef;
    --mut:#9e9a93;
    --acc:#d8c3a8;
    --panel-dark:#202024;
    --border:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block}

  /* 1. Cápsula Superior Izquierda: CASA CREATA + [💾 Distribuciones] + [+ Catálogo] */
  #topBarLeft{
    position:fixed;top:14px;left:18px;display:flex;align-items:center;gap:10px;
    background:var(--bar-bg);backdrop-filter:blur(14px);padding:6px 14px;border-radius:999px;
    box-shadow:0 8px 30px rgba(0,0,0,.32);z-index:20;border:1px solid var(--border);
  }
  .brand-title{font-size:13px;font-weight:800;letter-spacing:.06em;color:#ffffff;text-transform:uppercase}
  .btn-top-action{
    all:unset;cursor:pointer;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    color:#f5f3ef;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .btn-top-action:hover{background:rgba(255,255,255,.24);color:#fff}
  .btn-top-action.active{background:var(--btn-pill-active);color:var(--btn-pill-active-text);font-weight:700}

  /* 2. Cápsula Superior Derecha (Niveles, Muros y Herramientas sin traslapes) */
  #topBarRight{
    position:fixed;top:14px;right:18px;display:flex;align-items:center;gap:5px;
    background:var(--bar-bg);backdrop-filter:blur(14px);padding:5px 8px;border-radius:999px;
    box-shadow:0 8px 30px rgba(0,0,0,.32);z-index:20;border:1px solid var(--border);
    max-width:calc(100vw - 36px);overflow-x:auto;scrollbar-width:none;
  }
  #topBarRight::-webkit-scrollbar{display:none}
  .pill-btn{
    all:unset;cursor:pointer;background:var(--btn-pill);color:#e2ded8;font-size:11.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;white-space:nowrap;transition:all .15s ease;
    border:1px solid rgba(255,255,255,.06);
  }
  .pill-btn:hover{background:rgba(255,255,255,.18);color:#fff}
  .pill-btn.active{
    background:var(--btn-pill-active);color:var(--btn-pill-active-text);font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .pill-sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px;flex:none}

  /* Popover Desplegable para Slider [🧱 Muros] */
  #murosSliderWrap{
    position:fixed;top:62px;right:180px;display:none;flex-direction:column;gap:6px;
    background:var(--bar-bg);backdrop-filter:blur(14px);padding:10px 16px;border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:22;border:1px solid var(--border);color:#fff;
    min-width:180px;
  }
  #murosSliderWrap.open{display:flex}
  .muros-slider-header{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700}
  #murosRange{width:100%;accent-color:#ebd8c3;cursor:pointer;margin:4px 0}
  .muros-ticks{display:flex;justify-content:space-between;font-size:9.5px;color:#a8a39c}

  /* 3. CATÁLOGO DESPLEGABLE HACIA ABAJO (ESPACIOSO, CERO AMONTONAMIENTO) */
  #catalogDropdown{
    position:fixed;top:0;left:0;right:0;max-height:86vh;background:rgba(20,20,24,.98);
    backdrop-filter:blur(24px);border-bottom:2px solid rgba(235,216,195,.3);
    box-shadow:0 25px 60px rgba(0,0,0,.65);z-index:40;display:flex;flex-direction:column;
    transform:translateY(-105%);transition:transform .32s cubic-bezier(.16,1,.3,1);color:#fff;
  }
  #catalogDropdown.open{transform:translateY(0)}
  #catalogBackdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);
    z-index:38;opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  #catalogBackdrop.open{opacity:1;pointer-events:auto}

  .catalog-top-bar{
    padding:16px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .catalog-title-group h3{margin:0;font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
  .catalog-title-group p{margin:2px 0 0;font-size:11.5px;color:#a8a39c}

  .cat-chips-bar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .cat-chips-bar::-webkit-scrollbar{display:none}
  .cat-chip{
    all:unset;cursor:pointer;font-size:11.5px;padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.08);color:#d0ccc4;font-weight:600;white-space:nowrap;
    border:1px solid rgba(255,255,255,.08);transition:all .15s ease;
  }
  .cat-chip:hover{background:rgba(255,255,255,.18);color:#fff}
  .cat-chip.active{background:#ebd8c3;color:#1c1a18;font-weight:700;border-color:#ebd8c3}

  .btn-close-catalog{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;
    width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .btn-close-catalog:hover{background:rgba(255,255,255,.25)}

  .catalog-scroll-body{
    flex:1;overflow-y:auto;padding:20px 28px 30px;display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));gap:16px;
  }
  .catalog-scroll-body::-webkit-scrollbar{width:8px}
  .catalog-scroll-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

  /* Tarjeta de Mueble en el Catálogo Desplegable */
  .prod-card{
    background:#ffffff;border-radius:14px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.08);color:#212529;position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .18s ease,box-shadow .18s ease;
    min-height:260px;
  }
  .prod-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.4);border-color:#d8c3a8}
  .prod-card-img{
    width:100%;height:135px;background:#ffffff;display:flex;align-items:center;justify-content:center;
    padding:10px;position:relative;overflow:hidden;border-bottom:1px solid #f0f0f0;flex:none;
  }
  .prod-card-img img{max-width:100%;max-height:100%;object-fit:contain}
  .prod-card-img img.flipped{transform:scaleX(-1)}
  .badge-glb{
    position:absolute;top:8px;left:8px;background:rgba(28,26,24,.88);color:#d8c3a8;
    font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em;
  }
  .badge-var-count{
    position:absolute;top:8px;right:8px;background:rgba(40,40,45,.9);color:#fff;
    font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;
  }
  .prod-card-info{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1;background:#fff}
  .prod-card-title{font-size:12.5px;font-weight:800;margin:0;color:#1c1a18;line-height:1.25}
  .prod-card-variant{font-size:10.5px;color:#7a756f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prod-card-dim{font-size:10.5px;font-weight:700;color:#9e6a32;margin-top:auto;padding-top:4px}
  .btn-card-add{
    margin-top:8px;background:#1c1a18;color:#ebd8c3;font-size:11px;font-weight:700;
    padding:6px 10px;border-radius:7px;border:none;text-align:center;cursor:pointer;
    transition:background .15s;
  }
  .btn-card-add:hover{background:#353330}

  /* Botón Flotante Circular [+] en esquina inferior derecha */
  #fabAdd{
    position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:28px;
    background:#ebd8c3;color:#221e1a;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:700;cursor:pointer;border:none;outline:none;
    box-shadow:0 12px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.3);
    z-index:30;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .15s;
    user-select:none;
