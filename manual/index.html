      if (slide.type === "strategy") {

              <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                <b class="text-slate-800 block mb-1 uppercase text-[10px] tracking-wider">👁️ Cómo identificarlo:</b>
                <p ${editAttr} class="text-slate-600 leading-relaxed text-xs">${slide.visualDesc}</p>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-2 shadow-sm">
                <span class="text-slate-500 font-medium shrink-0">👥 ¿Quién lo usa?:</span>
                <span ${editAttr} class="text-slate-800 font-bold text-right">${slide.role}</span>
              </div>
            </div>
          </div>

          <!-- COLUMNA DERECHA: INSTRUCCIONES PASO A PASO -->
          <div class="lg:col-span-7 flex flex-col justify-between space-y-3.5">
            
            <!-- Bloque 1: ¿Para qué sirve? -->
            <div class="bg-white rounded-2xl p-4 space-y-1.5 border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-900 uppercase tracking-wider">
                🎯 1. ¿Para qué te sirve?
              </div>
              <p ${editAttr} class="text-sm text-slate-700 leading-relaxed font-normal">
                ${slide.purpose}
              </p>
              <div ${editAttr} class="pt-1 text-xs text-slate-500 font-medium">
                ⚡ <span class="font-bold text-slate-700">Beneficio:</span> ${slide.impact}
              </div>
            </div>

            <!-- Bloque 2: Cómo se usa paso a paso -->
            <div class="bg-white rounded-2xl p-4 space-y-2 border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-900 uppercase tracking-wider">
                👆 2. ¿Cómo se usa paso a paso?
              </div>
              <ol class="space-y-1.5 text-xs md:text-sm text-slate-700">
                ${slide.steps.map((s, i) => `
                  <li class="flex items-start gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-slate-100 border border-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>
                    <span ${editAttr} class="leading-relaxed">${s}</span>
                  </li>
                `).join('')}
              </ol>
            </div>

            <!-- Bloque 3: Tip Práctico -->
            <div class="rounded-2xl p-4 bg-amber-50/60 border border-amber-200/80 flex items-start gap-3 shadow-sm">
              <span class="text-lg">💡</span>
              <div>
                <div class="text-[11px] font-bold text-amber-900 uppercase tracking-wider">
                  Tip de Oro para Asesores y Gerentes
                </div>
                <p ${editAttr} class="text-xs md:text-sm text-amber-950 font-normal italic mt-0.5">
                  "${slide.goldenRule}"
                </p>
              </div>
            </div>

          </div>
        </div>

        <!-- PIE DE DIAPOSITIVA -->
        <div class="flex items-center justify-between border-t border-slate-200 pt-2.5 text-xs font-medium text-slate-400">
          <div>MANUAL OPERATIVO PARA ASESORES Y GERENTES • CREATA MUEBLES</div>
          <div>Diapositiva ${idx + 1} de ${total}</div>
        </div>
      `;
    }

    // =========================================================================
    // NAVEGACIÓN, EDICIÓN Y EXPORTACIÓN
    // =========================================================================
    function populateSelector() {
      const selector = document.getElementById('slideSelector');
      selector.innerHTML = slides.map((s, i) => `<option value="${i}">${i + 1}. ${s.id} - ${s.title}</option>`).join('');
    }

    function updateView() {
      if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1;
      if (currentSlideIndex < 0) currentSlideIndex = 0;

      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = renderSlideMarkup(slides[currentSlideIndex], currentSlideIndex, slides.length);
      document.getElementById('slideCounter').textContent = `${currentSlideIndex + 1} / ${slides.length}`;
      populateSelector();
      document.getElementById('slideSelector').value = currentSlideIndex;
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('btnEdit');
      const viewport = document.getElementById('slideViewport');
      if (isEditMode) {
        btn.innerHTML = "✏️ <span>Edición: ON (clic en textos)</span>";
        btn.className = "px-3 py-2 rounded-lg bg-slate-100 text-slate-900 border border-white text-xs font-semibold flex items-center gap-1.5 transition";
        viewport.classList.add('editing-active');
      } else {
        btn.innerHTML = "✏️ <span>Editar: OFF</span>";
        btn.className = "px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 transition";
        viewport.classList.remove('editing-active');
      }
      updateView();
    }

    function deleteCurrentSlide() {
      if (slides.length <= 1) {
        alert("Debes conservar al menos 1 diapositiva.");
        return;
      }
      const current = slides[currentSlideIndex];
      if (confirm(`¿Seguro que deseas borrar la diapositiva "${current.id} - ${current.title}"?`)) {
        slides.splice(currentSlideIndex, 1);
        if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1;
        updateView();
      }
    }

    function nextSlide() {
      if (isEditMode) return;
      currentSlideIndex = (currentSlideIndex + 1) % slides.length;
      updateView();
    }

    function prevSlide() {
      if (isEditMode) return;
      currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
      updateView();
    }

    function goToSlide(index) {
      currentSlideIndex = index;
      updateView();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function printDeck() {
      const printContainer = document.getElementById('print-container');
      printContainer.innerHTML = slides.map((s, i) => `
        <div class="print-slide flex flex-col justify-between">
          ${renderSlideMarkup(s, i, slides.length)}
        </div>
      `).join('');
      window.print();
    }

    function exportToPPTX() {
      const btn = document.getElementById('btnPptx');
      btn.textContent = "⏳ Generando PowerPoint...";
      btn.disabled = true;

      try {
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';
        pptx.author = 'CREATA Muebles';
        pptx.company = 'Grupo Anipa Interiorismo';
        pptx.title = 'Manual de Uso para Asesores y Gerentes - CREATA Muebles';

        slides.forEach((s, idx) => {
          const slide = pptx.addSlide();
          slide.background = { color: 'FFFFFF' };

          if (s.type === "cover") {
            slide.addShape(pptx.ShapeType.rect, { x: 0.6, y: 0.7, w: 12.1, h: 6.0, fill: { color: '0F172A' }, line: { color: '334155', width: 1 } });
            slide.addText(s.module, { x: 1.0, y: 1.2, w: 11.3, h: 0.4, fontSize: 12, bold: true, color: '94A3B8', align: 'center' });
            slide.addText(s.title, { x: 1.0, y: 1.8, w: 11.3, h: 1.0, fontSize: 32, bold: true, color: 'FFFFFF', align: 'center' });
            slide.addText(s.subtitle, { x: 1.0, y: 2.8, w: 11.3, h: 0.7, fontSize: 15, color: 'CBD5E1', align: 'center' });
            slide.addText(s.pitch, { x: 1.2, y: 3.7, w: 10.9, h: 1.8, fontSize: 12, italic: true, color: 'F1F5F9', align: 'center' });
            slide.addText(s.author, { x: 1.0, y: 5.8, w: 11.3, h: 0.4, fontSize: 11, bold: true, color: '94A3B8', align: 'center' });
            return;
          }

          if (s.type === "strategy") {
            slide.addText(`${s.id}  |  ${s.module}`, { x: 0.5, y: 0.35, w: 12.3, h: 0.3, fontSize: 10, bold: true, color: '64748B' });
            slide.addText(s.title, { x: 0.5, y: 0.65, w: 12.3, h: 0.5, fontSize: 20, bold: true, color: '0F172A' });

            slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 1.35, w: 5.9, h: 4.7, fill: { color: 'FFFFFF' }, line: { color: 'E2E8F0', width: 1 } });
            slide.addText(s.leftTitle, { x: 0.7, y: 1.5, w: 5.5, h: 0.4, fontSize: 13, bold: true, color: '0F172A' });
            slide.addText(s.leftItems.map(i => `• ${i}`).join('\n\n'), { x: 0.7, y: 2.0, w: 5.5, h: 3.8, fontSize: 11, color: '475569' });

            slide.addShape(pptx.ShapeType.rect, { x: 6.7, y: 1.35, w: 6.1, h: 4.7, fill: { color: 'F8FAFC' }, line: { color: 'E2E8F0', width: 1 } });
            slide.addText(s.rightTitle, { x: 6.9, y: 1.5, w: 5.7, h: 0.4, fontSize: 13, bold: true, color: '0F172A' });
            slide.addText(s.rightItems.map(i => `• ${i}`).join('\n\n'), { x: 6.9, y: 2.0, w: 5.7, h: 3.8, fontSize: 11, color: '334155' });

            slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 6.25, w: 12.3, h: 0.6, fill: { color: 'F1F5F9' }, line: { color: 'E2E8F0', width: 1 } });
            slide.addText(`💡 ${s.footerNote}`, { x: 0.7, y: 6.32, w: 11.9, h: 0.45, fontSize: 10, color: '475569' });
            return;
          }

          slide.addText(`${s.id}  •  ${s.module}`, { x: 0.5, y: 0.35, w: 9.0, h: 0.3, fontSize: 10, bold: true, color: '64748B' });
          slide.addText(s.title, { x: 0.5, y: 0.65, w: 9.0, h: 0.5, fontSize: 18, bold: true, color: '0F172A' });

          slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 1.3, w: 4.5, h: 5.5, fill: { color: 'F8FAFC' }, line: { color: 'E2E8F0', width: 1 } });
          slide.addText("ASÍ SE VE EN TU PANTALLA", { x: 0.7, y: 1.45, w: 4.1, h: 0.3, fontSize: 10, bold: true, color: '0F172A' });
          slide.addText(`Ubicación: ${s.location}\nElemento: ${s.fileName}`, { x: 0.7, y: 1.85, w: 4.1, h: 0.6, fontSize: 9, color: '64748B' });
          slide.addText(`Cómo identificarlo:\n${s.visualDesc}`, { x: 0.7, y: 2.6, w: 4.1, h: 2.3, fontSize: 10, color: '334155' });
          slide.addText(`¿Quién lo usa?:\n${s.role}`, { x: 0.7, y: 5.2, w: 4.1, h: 1.2, fontSize: 9.5, bold: true, color: '0F172A' });

          slide.addShape(pptx.ShapeType.rect, { x: 5.2, y: 1.3, w: 7.6, h: 1.75, fill: { color: 'FFFFFF' }, line: { color: 'E2E8F0', width: 1 } });
          slide.addText("1. ¿PARA QUÉ TE SIRVE?", { x: 5.4, y: 1.4, w: 7.2, h: 0.3, fontSize: 10, bold: true, color: '0F172A' });
          slide.addText(`${s.purpose}\nBeneficio: ${s.impact}`, { x: 5.4, y: 1.72, w: 7.2, h: 1.2, fontSize: 10, color: '475569' });

          slide.addShape(pptx.ShapeType.rect, { x: 5.2, y: 3.2, w: 7.6, h: 2.2, fill: { color: 'FFFFFF' }, line: { color: 'E2E8F0', width: 1 } });
          slide.addText("2. ¿CÓMO SE USA PASO A PASO?", { x: 5.4, y: 3.3, w: 7.2, h: 0.3, fontSize: 10, bold: true, color: '0F172A' });
          slide.addText(s.steps.map((st, i) => `${i + 1}. ${st}`).join('\n'), { x: 5.4, y: 3.65, w: 7.2, h: 1.6, fontSize: 10, color: '475569' });

          slide.addShape(pptx.ShapeType.rect, { x: 5.2, y: 5.55, w: 7.6, h: 1.25, fill: { color: 'FEF3C7' }, line: { color: 'FDE68A', width: 1 } });
          slide.addText("💡 TIP DE ORO", { x: 5.4, y: 5.65, w: 7.2, h: 0.3, fontSize: 9.5, bold: true, color: '92400E' });
          slide.addText(`"${s.goldenRule}"`, { x: 5.4, y: 5.95, w: 7.2, h: 0.75, fontSize: 10, italic: true, color: '78350F' });
        });

        pptx.writeFile({ fileName: 'Manual_Asesores_y_Gerentes_CREATA.pptx' }).then(() => {
          btn.textContent = "✅ ¡PowerPoint Descargado!";
          setTimeout(() => {
            btn.textContent = "📊 Descargar PowerPoint (.PPTX)";
            btn.disabled = false;
          }, 3000);
        });
      } catch (err) {
        alert("Error al generar PPTX: " + err.message);
        btn.textContent = "📊 Descargar PowerPoint (.PPTX)";
        btn.disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateView();
      window.addEventListener('keydown', (e) => {
        if (isEditMode) return;
        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevSlide();
        }
      });
    });
  </script>
</body>
</html>
